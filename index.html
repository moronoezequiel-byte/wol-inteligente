<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WOL Inteligente v6</title>
<style>
body{font-family:Arial,sans-serif;max-width:900px;margin:auto;padding:20px;background:#111;color:#eee}
textarea{width:100%;min-height:120px;padding:12px;box-sizing:border-box;border-radius:10px}
button{margin-top:10px;padding:12px 18px;border:0;border-radius:10px;cursor:pointer}
.card{background:#1d1d1d;padding:15px;margin:12px 0;border-radius:12px}
a{color:#8ecbff}.muted{color:#aaa}.error{color:#ff9b9b}
</style>
</head>
<body>
<h1>WOL Inteligente <small>v6</small></h1>
<p class="muted">Pregunta en lenguaje natural. La IA interpreta; los resultados vienen de WOL.</p>

<textarea id="question" placeholder="Ejemplo: ¿Cómo puedo ayudar a alguien que está desanimado?"></textarea>
<br>
<button onclick="searchWol()">INTERPRETAR Y BUSCAR EN WOL</button>

<div id="status"></div>
<div id="interpretation"></div>
<div id="articles"></div>

<script>
function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

async function searchWol(){
  const q=document.getElementById("question").value.trim();
  const status=document.getElementById("status");
  const interpretation=document.getElementById("interpretation");
  const articles=document.getElementById("articles");

  if(!q){status.innerHTML='<p class="error">Escribí una pregunta.</p>';return;}

  status.innerHTML="<p>Buscando en WOL…</p>";
  interpretation.innerHTML="";
  articles.innerHTML="";

  try{
    const r=await fetch("/api/search",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({question:q})
    });
    if(!r.ok) throw new Error("HTTP "+r.status);
    const d=await r.json();

    interpretation.innerHTML=`
      <div class="card">
        <b>Intención:</b> ${esc(d.intent)}<br>
        <b>Tema:</b> ${esc(d.topic)}<br>
        <b>Contexto:</b> ${esc(d.context)}<br>
        <b>Objetivo:</b> ${esc(d.goal)}<br>
        <b>Conceptos:</b> ${esc((d.concepts||[]).join(", "))}
      </div>`;

    const items=d.articles||[];
    if(!items.length){
      articles.innerHTML='<div class="card"><b>No se encontraron artículos.</b><br>Podés abrir las búsquedas propuestas directamente en WOL.</div>';
    }else{
      articles.innerHTML="<h2>Artículos encontrados en WOL</h2>"+
        items.map((x,i)=>`<div class="card">
          <b>${i+1}. ${esc(x.title)}</b><br>
          <a href="${esc(x.url)}" target="_blank" rel="noopener">ABRIR ARTÍCULO EN WOL →</a>
          <div class="muted">Búsqueda: ${esc(x.query)}</div>
        </div>`).join("");
    }

    status.innerHTML=`<p>Listo. ${items.length} artículo(s) encontrados.</p>`;
  }catch(e){
    console.error(e);
    status.innerHTML='<p class="error">No se pudo conectar al servidor.</p>';
  }
}
</script>
</body>
</html>
